plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mapboxnavigation'
version = '2.5.0'

// ---------------------------------------------------------------------------
// Mapbox Maven repository (Maps SDK). Added on rootProject.allprojects so the transitive
// Mapbox artifacts resolve from the app project as well.
// A downloads token (sk.… with DOWNLOADS:READ) is only attached when provided:
//   - gradle property  MAPBOX_DOWNLOADS_TOKEN   (~/.gradle/gradle.properties)
//   - or env variable  MAPBOX_DOWNLOADS_TOKEN
// ---------------------------------------------------------------------------
def mapboxDownloadsToken =
  (project.findProperty('MAPBOX_DOWNLOADS_TOKEN') ?: System.getenv('MAPBOX_DOWNLOADS_TOKEN'))

rootProject.allprojects {
  repositories {
    maven {
      url 'https://api.mapbox.com/downloads/v2/releases/maven'
      if (mapboxDownloadsToken) {
        authentication { basic(BasicAuthentication) }
        credentials {
          username = 'mapbox'
          password = mapboxDownloadsToken
        }
      }
    }
  }
}

// Maps SDK version (override with -PmapboxMapsVersion=x.y.z or in gradle.properties)
def mapboxMapsVersion = project.findProperty('mapboxMapsVersion') ?: '11.33.0'

android {
  namespace "expo.modules.mapboxnavigation"
  defaultConfig {
    versionCode 1
    versionName "2.5.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The map gets a lifecycle of its own (see MapBundle.kt); the version is resolved to the one the app already uses.
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
  // Only the MAP. Navigation (routing, banners, voice, rerouting) runs in TypeScript – no Navigation SDK.
  api "com.mapbox.maps:android:${mapboxMapsVersion}"
}
